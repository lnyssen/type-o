<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GenType — parametric type generator</title>
    <meta name="description" content="Open-source generative typography: shape skeletons, turn eight dials, export production .ttf, .otf and .woff fonts." />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e1e1e'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial' font-size='20' font-weight='700' text-anchor='middle' fill='%237d39eb'%3EG%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">G</span>
        <span class="wordmark">GenType</span>
        <input id="project-name" class="project-name" value="Untitled" spellcheck="false" aria-label="Font name" />
      </div>
      <nav class="pills" id="modes" aria-label="Workspace"></nav>
      <div class="topbar-actions">
        <button class="pill" id="btn-open">Open</button>
        <button class="pill" id="btn-save">Save</button>
        <a class="pill pill-accent" id="btn-github" href="https://github.com/" target="_blank" rel="noreferrer noopener">GitHub ↗</a>
      </div>
    </header>

    <main id="workspace"></main>

    <footer class="statusbar">
      <span id="status-glyphs">—</span>
      <span id="status-time"></span>
      <span id="status-python"></span>
      <span class="grow"></span>
      <span>MIT licensed · fonts you generate are yours</span>
    </footer>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" accept=".gentype,application/json" hidden />
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
